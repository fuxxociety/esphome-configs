# D2 GPIO04 / IO18 : white led (inverted)
# D1 GPIO05 / IO19 : red led (inverted)
# D6 GPIO12 / IO04 : relay
# D7 GPIO13 / IO05 : button (inverted)
# D5 GPIO14 / IO03 : power/usage sensor (inverted)
# ##################################
substitutions:
  name: switch-3w-upstairs                   # **** CHANGE DEVICE NAME TO SOMETHING UNIQUE PER DEVICE.  RENAME YAML FILE TO SAME NAME.    ****
  friendly_name: 'Upstairs 3-Way'         # **** CHANGE FRIENDLY NAME TO SOMETHING UNIQUE PER DEVICE

esphome:
  name: $name

  platformio_options:
    board_build.mcu: esp32c3
    board_build.variant: esp32c3  
    board_build.flash_mode: dio 

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  domain: !secret wifi_dns_domain
  ssid: !secret wifi_ssid           # !secret wifi_ssid
  password: !secret wifi_password   # !secret wifi_password
  output_power: 17
  reboot_timeout: 10min
  use_address: 10.10.32.94
  fast_connect: true


logger:

api:
  id: kauf_api
  reboot_timeout: '15min'
  encryption:
    key: !secret api_enc_key   # password auth removed in ESPHome 2026.1

ota:
    platform: esphome
    id: my_ota
    password: !secret esphome_ota_password

binary_sensor:
  - platform: gpio
    id: sense5
    name: sense5
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true
  - platform: gpio
    id: sense3
    name: sense3
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: true
      inverted: true
  - platform: gpio
    id: sense18
    name: sense18
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: true
  - platform: gpio
    id: sense19
    name: sense19
    pin:
      number: GPIO19
      mode:
        input: true
        pullup: true
      inverted: true

switch:
  - platform: gpio
    id: relay
    name: Relay
    pin: GPIO4
---
api:
  services:
    - service: variable_brightness
      variables:
        brightness: string
      then:
        - logger.log: "Received brightness command"
        - if:
            condition:
              lambda: 'return brightness == "red";'
            then:
              - script.execute: effect_red
        - if:
            condition:
              lambda: 'return brightness == "blue";'
            then:
              - script.execute: effect_blue
        - if:
            condition:
              lambda: 'return brightness == "green";'
            then:
              - script.execute: effect_green
        - if:
            condition:
              lambda: 'return brightness == "yellow";'
            then:
              - script.execute: effect_yellow
        - if:
            condition:
              lambda: 'return brightness == "candle";'
            then:
              - script.execute: effect_candle
        - if:
            condition:
              lambda: 'return brightness == "bright";'
            then:
              - script.execute: effect_bright
        - if:
            condition:
              lambda: 'return brightness == "medium";'
            then:
              - script.execute: effect_medium
        - if:
            condition:
              lambda: 'return brightness == "low";'
            then:
              - script.execute: effect_low
        - if:
            condition:
              lambda: 'return brightness == "night";'
            then:
              - script.execute: effect_night
        - if:
            condition:
              lambda: 'return brightness == "sleep";'
            then:
              - script.execute: effect_sleep
        - if:
            condition:
              lambda: 'return brightness == "off";'
            then:
              - script.execute: effect_off

script:
  - id: effect_red
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
  - id: effect_blue
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 100%
          red: 0%
          green: 0%
          blue: 100%
  - id: effect_green
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 100%
          red: 0%
          green: 100%
          blue: 0%
  - id: effect_yellow
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 100%
          red: 100%
          green: 100%
          blue: 0%
  - id: effect_candle
    then:
      - light.turn_on:
          id: ${bulb_id}
          # TBD
  - id: effect_bright
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 100%
          red: 100%
          green: 100%
          blue: 100%
  - id: effect_medium
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 60%
          red: 100%
          green: 100%
          blue: 100%
  - id: effect_low
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 30%
          red: 100%
          green: 100%
          blue: 100%
  - id: effect_night
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 30%
          red: 100%
          green: 55%
          blue: 55%
  - id: effect_night
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 35%
          red: 100%
          green: 55%
          blue: 55%
  - id: effect_sleep
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 10%
          red: 100%
          green: 55%
          blue: 55%
  - id: effect_off
    then:
      - light.turn_off:
          id: ${bulb_id}

---
globals:
  - id: latch_${number}
    type: bool
    restore_value: no
    initial_value: "false"

binary_sensor:
  - platform: gpio
    pin:
      inverted: true
      number: ${gpio_pin}
    name: '${friendly_name} Button ${number}'
    internal: true
    on_multi_click: !include: on-multi-click.yaml

switch:
  - name: '${friendly_name} Latch'
    platform: template
    id: latch_mode
    device_class: "switch"
    entity_category: "config"
    lambda: |-
      if (id(latch_${number})) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      - globals.set:
          id: latch_${number}
          value: "true"
      - ${output_${number}_type}turn_on: '${output_${number}_type}${number}'
    turn_off_action:
      - globals.set:
          id: latch_${number}
          value: "false"
      - ${output_${number}_type}turn_off: '${output_${number}_type}${number}'
  - platform: template
    id: logicswitch
    name: ${friendly_name} Switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - light.turn_on:
            id: indicator
            effect: "None"
            brightness: 100%
        - if:
            condition:
              - api.connected:
              - lambda: 'return id(latch_${number});'
            then:
              - homeassistant.event:
                  event: esphome.switch
                  data:
                    device: ${name}
                    action: 'turn_on'
                    switch: 'switch${number}'
            else: # If HA can't be reached, then
              - ${output_${number}_type}turn_on: '${output_${number}_type}${number}'
    on_turn_off:
      then:
        - light.turn_off: indicator
        - if:
            condition:
            - api.connected:
            - lambda: 'return id(latch_${number});'
            then:
              - homeassistant.event:
                  event: esphome.switch
                  data:
                    device: ${name}
                    action: 'turn_off'
                    switch: 'switch${number}'
            else: # If HA can't be reached, then
            - ${output_${number}_type}turn_off: '${output_${number}_type}${number}'

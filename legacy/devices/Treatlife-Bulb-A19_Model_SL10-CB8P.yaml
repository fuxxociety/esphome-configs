---
# Treatlife RGB Bulb - Model SL-10
# New style, with CB8P wireless module
substitutions:
  nameprefix: 'bulb-'

  appliance_name: Treatlife.SL-10
  esp_module_type: 'Tuya CB8P'

  disable_entities:  "true"    # set to "false" to have all entities show up in Home Assistant automatically

  sub_red_pin: 'P7'
  sub_green_pin: 'P8'
  sub_blue_pin: 'P9'
  sub_white_pin: 'P24'

  sub_on_turn_on:  script_do_nothing
  sub_on_turn_off: script_do_nothing

  bulb_id: 'bulb1'

packages:
  common: !include ../modules/BK7231N.yaml
  colorscript: !include light-effects/effects_script_white.yaml

esphome:
  project:
    name: $appliance_name
    version: $esp_module_type

# PWM outputs for each LED channel
# https://esphome.io/components/output/esp8266_pwm.html
output:
  - platform: libretiny_pwm
    pin: ${sub_red_pin}
    frequency: 200 Hz
    id: output_red
    max_power: .85
  - platform: libretiny_pwm
    pin: ${sub_green_pin}
    frequency: 200 Hz
    id: output_green
    max_power: .85
  - platform: libretiny_pwm
    pin: ${sub_blue_pin}
    frequency: 200 Hz
    id: output_blue
    max_power: .85
  - platform: libretiny_pwm
    pin: ${sub_white_pin}
    frequency: 400 Hz
    id: output_white
    max_power: .85

# https://esphome.io/components/light/index.html
light:
  # Main RGBW light
  - platform: rgbw
    name: ${servicename}
    default_transition_length: 250ms
    id: ${bulb_id}
    red: output_red
    green: output_green
    blue: output_blue
    white: output_white
    color_interlock: true
    restore_mode: $light_restore_mode
    on_turn_on:
      - homeassistant.event:
          event: esphome.light
          data:
            device_id: '${system_name}'
            action: 'on'
      - script.execute: $sub_on_turn_on
    on_turn_off:
      - homeassistant.event:
          event: esphome.light
          data:
            device_id: '${system_name}'
            action: 'off'
      - script.execute: $sub_on_turn_off
    effects: !include light-effects/effects_rgbw.yaml


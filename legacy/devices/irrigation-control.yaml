# clock input from Home Assistant used to calculate total daily energy
# https://esphome.io/components/time.html#home-assistant-time-source
time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: America/Chicago
    # Time based automations.
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - if:
              condition:
                - binary_sensor.is_off: ui_disable_zone1
              then:
                - lambda: |-
                    if (scheduled_runtime(id(irrigation_zone1_next).state.c_str())) {
                      id(irrigation_zone1).turn_on(); }
          # and repeat for each zone...

  # Grab time from sntp server ?
  - platform: sntp
    id: esptime
    servers:
      - 10.10.32.1
      - 10.10.24.2
    timezone: America/Chicago


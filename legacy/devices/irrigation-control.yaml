# https://esphome.io/components/binary_sensor/index.html
binary_sensor:
  # ============================================================================= #
  # Bring input_boolean buttons from HA to disable schedules
  - platform: homeassistant
    id: ui_disable_zone1
    entity_id: input_boolean.irrigation_disable_schedule_zone1
    on_state:
      then:
        # Update the next scheduled run time.
        - text_sensor.template.publish:
            id: irrigation_zone1_next
            state: !lambda |-
              if (id(ui_disable_zone1).state) {
                return {"Schedule Disabled"};
              } else {
                return update_next_runtime(id(irrigation_zone1_times).state, id(irrigation_zone1_days).state);
              }
  # and repeat for each zone

  # button input toggles relay and thereby power led
  # https://esphome.io/components/binary_sensor/gpio.html
  - platform: gpio
    id: button_in
    name: $friendly_name Button
    pin:
      number: $sub_button_pin
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - lambda: |-
          // store time of press and clear duration sensor
          id(global_press_time) = esphome::millis();
          id(sensor_press_duration).publish_state(0);

          // toggle if configured for toggle on press
          if (id(select_button).state == "Toggle on Press") {
            id(relay1).toggle(); }
      - script.execute: $sub_on_press
      - script.execute: script_30s_timer
    on_release:
      - lambda: |-
          // set duration sensor
          id(sensor_press_duration).publish_state(esphome::millis() - id(global_press_time) + id(number_debounce).state);

          // toggle if configured on release and toggle check script is not running.
          if (  (id(select_button).state == "Toggle on Release") && !id($sub_toggle_check).is_running() ) {
            id(relay1).toggle();
          }
      - script.execute: $sub_on_release
      - script.stop: script_30s_timer
    filters:
      - delayed_on: !lambda return id(number_debounce).state;


# https://esphome.io/guides/automations.html#script-component
script:

    # sets LEDs to proper state based on LED configuration and relay state
  - id: script_set_power_leds
    then:
      - lambda: |-
          // if led follows power status
          if ( (id(select_bled).state == "Power Status") || (id(select_bled).state == "Error and Power") ) {
            id(led).publish_state(id(relay1).state); }

          // if led follows inverse of power status
          else if ( (id(select_bled).state == "Invert Power Status") || (id(select_bled).state == "Error and Invert Power") ) {
            id(led).publish_state(!id(relay1).state); }

      - script.execute: script_save_changes

  - id: blink_status_led
    mode: queued
    then:

      - lambda: |-
          // turn on led if configured for error status
          if ( (id(select_bled).state == "Error Status")  ||
               (id(select_bled).state == "Error and Power") ||
               (id(select_bled).state == "Error and Invert Power") ) {
            id(led).turn_on(); }

      - delay: 350ms

      - lambda: |-
          // turn off led if configured for error status
          if ( (id(select_bled).state == "Error Status")  ||
               (id(select_bled).state == "Error and Power") ||
               (id(select_bled).state == "Error and Invert Power") ) {
            id(led).turn_off(); }

      - delay: 1150ms

      - if:
          condition:
            - lambda: return ( ( (App.get_app_state() & STATUS_LED_ERROR) != 0u) || ((App.get_app_state() & STATUS_LED_WARNING) != 0u) );
          then:
            - script.execute: blink_status_led      # repeat as long as error/warning exists
          else:
            - script.execute: script_set_power_leds # done with status LED, restore light power status

  - id: script_setting_reboot
    mode: restart          # only reboot plug settings are static for 10s.  Another change restarts timer.
    then:
      - lambda: ESP_LOGCONFIG("kauf-plug.yaml","Setting change requiring reboot detected, rebooting in 10 seconds to effect change.");
      - delay: 10s
      - button.press: restart_button

  - id: script_30s_timer
    then:
      - delay: !lambda return (30000-id(number_debounce).state);
      - script.execute: $sub_on_hold_30s

  - id: on_wifi_connect
    then:

        # wait until wifi connects
      - wait_until: wifi.connected

      - lambda: |-
          ESP_LOGD("KAUF on_boot","------------------->>>>>>>>>>>>>>>>>   wifi connected, cranking ap timeout back up");
          wifi_wificomponent_id->set_ap_timeout(2147483647);

  - id: script_force_ap
    then:
      - logger.log: "------------------->>>>>>>>>>>>>>>>>   HELD BUTTON 30 SECONDS, FORCING AP"

      # overwrite software defined credentials to force ap to turn on.
      - lambda: wifi::global_wifi_component->save_wifi_sta("initial_ap","asdfasdfasdfasdf");

      # blink LED for 10s then restart to get captive portal to turn on.
      - script.execute: blink_led
      - delay: 10s
      - button.press: restart_button

    # blink LED forever. Used when button is held to re-enable AP. Stops blinking because plug restarts.
  - id: blink_led
    mode: queued
    then:
      - switch.toggle: led
      - delay: 333ms
      - script.execute: blink_led

  - id: script_do_nothing
    then:
      - lambda: return;

  - id: script_save_changes
    mode: restart
    then:
      - delay: 3s
      - lambda: global_preferences->sync();


# pwm outputs for LED so it can be dimmed
# https://esphome.io/components/output/libretiny_pwm.html
output:
  - platform: libretiny_pwm
    id: led_pwm
    frequency: 200 Hz
    pin: $sub_led_pin
    inverted: true

# https://esphome.io/components/switch/index.html
switch:
  # ============================================================================= #
  # Virtual Zone Switches which toggle the relay, and store the current state.
  - platform: template
    name: "Irrigation Zone 1"
    id: irrigation_zone1
    icon: mdi:sprinkler
    lambda: return id(relay1).state;
    optimistic: true
    turn_on_action:
      # Turn on if not disabled.
      if:
        condition:
          lambda: return id(irrigation_zone1_duration).state >= 1;
        then:
          - switch.turn_on: relay1
    turn_off_action:
      - switch.turn_off: relay1
  # repeat for each zone

  - platform: gpio
    id: relay1
    name: "Irrigation Zone 1 Relay"
    icon: mdi:sprinkler #mdi:electric-switch
    pin:
      number: $sub_relay1_pin
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        # Carried over from kauf config
        - script.execute: script_set_power_leds
        - script.execute: $sub_on_turn_on
        # Start the countdown timer.
        - globals.set:
            id: remaining_time1
            value: !lambda return id(irrigation_zone1_duration).state * 60;
        # Show the remaining time.
        - sensor.template.publish:
            id: irrigation_zone1_remaining
            state: !lambda return id(irrigation_zone1_duration).state;
          # Show the "Next Time" as "now".
        - text_sensor.template.publish:
            id: irrigation_zone1_next
            state: "now"
        # state NOW on original code, change to your preferred language
    on_turn_off:
     then:
        # Carried over from kauf config
        - script.execute: script_set_power_leds
        - script.execute: $sub_on_turn_off
        # Stop the countdown timer
        - sensor.template.publish:
            id: irrigation_zone1_remaining
            state: "0"
        # Update the next scheduled run time.
        - text_sensor.template.publish:
            id: irrigation_zone1_next
            state: !lambda |- 
              if (id(ui_disable_zone1).state) {
                return {"Schedule Disabled"};
              } else {
                return update_next_runtime(id(irrigation_zone1_times).state, id(irrigation_zone1_days).state);
              }
  # repeat for each zone

  - platform: template
    name: Stop Active Irrigation Zones
    id: stop_all_zones
    icon: mdi:close-octagon-outline
    optimistic: true
    turn_on_action:
      - switch.turn_off: relay1
      # repeat switch.turn_off for each zone
      - delay: 2s
      - switch.turn_off: stop_all_zones

  # relay output
  # https://esphome.io/components/switch/gpio.html
#  - platform: gpio
#    id: relay
#    name: $friendly_name
#    pin: $sub_relay_pin
#    entity_category: ''
#    restore_mode: $sub_restore_mode

    # https://esphome.io/components/switch/template.html
  - platform: template
    id: switch_no_hass
    name: $friendly_name No HASS
    optimistic: true
    entity_category: config
    disabled_by_default: $disable_entities
    icon: mdi:toggle-switch-off-outline
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: |-
          id(kauf_api).set_reboot_timeout(0);  // 0 disables auto rebooting and also new status led blinking.  doesn't stop current status led blinking
          id(kauf_api).status_clear_warning(); // stops current status led blinking, timeout 0 keeps it from restarting
      - script.execute: script_save_changes
    on_turn_off:
      - lambda: id(kauf_api).set_reboot_timeout(900000);
      - script.execute: script_save_changes

  - platform: template
    id: led
    name: $friendly_name led
    optimistic: true
    entity_category: config
    disabled_by_default: $disable_entities
    icon: mdi:led-outline
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(led_pwm).set_level(id(led_brightness).state/100);
    on_turn_off:
      - lambda: id(led_pwm).set_level(0.0);


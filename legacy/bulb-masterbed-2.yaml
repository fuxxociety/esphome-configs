substitutions:
  uptime_name: "${friendly_name} Uptime"   # live entity has no -1/-2 suffix (keeps HA history)
  device_description: Treatlife SL-10 Bulb / Tuya WB8P MCU / PWM LED driver
  system_name: masterbed       # **** CHANGE DEVICE NAME TO SOMETHING UNIQUE PER DEVICE.  RENAME YAML FILE TO SAME NAME.    ****
                               # **** USE DASHES (-) INSTEAD OF SPACES OR UNDERSCORE (_).  USE ONLY LOWER CASE LETTERS.     ****
  namesuffix: '-2'
  servicename: 'bulb_masterbed_2'
  friendly_name: 'Master Bedroom Ceiling' # Displayed in HA frontend

  light_restore_mode: RESTORE_INVERTED_DEFAULT_OFF  # change power-on action for main light entity
  default_power_on_state: "Restore Power Off State"

  disable_entities:  "true"     # set to "false" to have all entities show up in Home Assistant automatically
  disable_webserver: "true"    # set to "true" to disable the webserver listening on port 80.

packages:
  # Old style WB8P MCU - MAC beginning with 70-89-76
  bulb: !include ./devices/Treatlife-Bulb-A19_Model_SL10-WB8P.yaml

api:
  services:
    - service: variable_brightness
      variables:
        brightness: string
      then:
        - logger.log: "Received brightness command"
        - if:
            condition:
              lambda: 'return brightness == "red";'
            then:
              - script.execute: effect_red
        - if:
            condition:
              lambda: 'return brightness == "blue";'
            then:
              - script.execute: effect_blue
        - if:
            condition:
              lambda: 'return brightness == "green";'
            then:
              - script.execute: effect_green
        - if:
            condition:
              lambda: 'return brightness == "yellow";'
            then:
              - script.execute: effect_yellow
        - if:
            condition:
              lambda: 'return brightness == "night";'
            then:
              - script.execute: effect_night
        - if:
            condition:
              lambda: 'return brightness == "relax";'
            then:
              - script.execute: effect_relax
        - if:
            condition:
              lambda: 'return brightness == "reading";'
            then:
              - script.execute: effect_reading
        - if:
            condition:
              lambda: 'return brightness == "work";'
            then:
              - script.execute: effect_work
        - if:
            condition:
              lambda: 'return brightness == "sleep";'
            then:
              - script.execute: effect_sleep

# This is for RGB lights
# https://esphome.io/guides/automations.html#script-component
script:

  - id: effect_red
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
          # white: 0%

  - id: effect_blue
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 100%
          red: 0%
          green: 0%
          blue: 100%
          # white: 0%

  - id: effect_green
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 100%
          red: 0%
          green: 100%
          blue: 0%
          # white: 0%

  - id: effect_yellow
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 100%
          red: 100%
          green: 100%
          blue: 0%
          # white: 0%

  - id: effect_night
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 30%
          # white 0%
          red: 100%
          green: 55%
          blue: 55%
  - id: effect_relax
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 50%
          # white: 50%
          color_temperature: 500 mireds
          # red: 100%
          # green: 100%
          # blue: 100%

  - id: effect_reading
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 80%
          # white: 80%
          color_temperature: 414 mireds
          # red: 100%
          # green: 100%
          # blue: 100%

  - id: effect_work
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 80%
          # white: 80%
          color_temperature: 240 mireds
          # red: 100%
          # green: 100%
          # blue: 100%

  - id: effect_sleep
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 10%
          red: 100%
          green: 55%
          blue: 55%
          # white: 0%

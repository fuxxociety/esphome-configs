# Downstairs leg of the stairwell 3-way (the other leg: switch-upstairs-stairwell). Both legs share room_key `stairs`
# and keep Relay Config in sync with each other over UDP (templates/treatlife/ss01-3way.yaml).
# was downstairs-3w-light-switch (legacy/downstairs-stairwell.yaml); HA device "Downstairs 3-Way"
substitutions:
  name: switch-downstairs-stairwell
  friendly_name: Downstairs Stairwell
  room_key: stairs
  peer: switch-upstairs-stairwell

packages:
  device: !include templates/treatlife/ss01-3way.yaml

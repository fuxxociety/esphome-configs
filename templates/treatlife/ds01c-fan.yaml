# Treatlife DS01C "dimmer" switch driving a CEILING FAN motor, original ESP-12E module (logic: ds01c-fan-core.yaml).
# ESP-12E + tuya MCU on UART (GPIO1 TX / GPIO3 RX, 9600), button GPIO13 (inverted).
#
# Device file:
#   substitutions: {name: fan-masterbed-ceiling, friendly_name: Master Bed Ceiling, room_key: masterbed_ceiling}
#   packages:      {device: !include templates/treatlife/ds01c-fan.yaml}
substitutions:
  button_pin: GPIO13
  uart_tx_pin: GPIO1
  uart_rx_pin: GPIO3

packages:
  platform: !include ../../common/platforms/esp8266.yaml
  fan: !include ds01c-fan-core.yaml

esp8266:
  restore_from_flash: true
  early_pin_init: false   # don't glitch the UART lines to the MCU at boot

# Ceiling fixture: CWW centre PANEL (the main light) + addressable RGB RING around it (the accent), on an ESP8266
# (BEHAVIOR.md §6). Two entities so both can run at once with independent settings: the panel carries the
# fixture's name, the ring is "Ring".
#
# Device file:
#   substitutions: {name: light-masterbath-shower, friendly_name: Master Bath Shower Fixture, room_key: masterbath_shower,
#                   cw_pin: GPIO5, ww_pin: GPIO4, ring_leds: '60'}
#   packages:      {device: !include templates/fixture/rgb-cww.yaml}
substitutions:
  device_description: RGB ring + CWW panel ceiling fixture
  cw_pin: GPIO5
  ww_pin: GPIO4
  pwm_frequency: 300 Hz
  panel_max_power: 100%
  cold_kelvin: 6535 K
  warm_kelvin: 2000 K
  ring_pin: GPIO2
  ring_leds: '60'
  ring_variant: WS2812
  ring_order: GRB
  # Disco Strobe (HA's Disco Shower script times the bursts): cold white at full power, flashing in hardware
  pwm_frequency_hz: '300'      # = pwm_frequency, as a number for the restore
  strobe_hz: '100'
  strobe_max_burst: 600ms      # a burst never lasts longer than this, whatever HA asks

packages:
  platform: !include ../../common/platforms/esp8266.yaml
  bulb: !include ../../common/light/bulb.yaml

output:
  - {platform: esp8266_pwm, id: output_cold, pin: '${cw_pin}', frequency: '${pwm_frequency}', max_power: '${panel_max_power}'}
  - {platform: esp8266_pwm, id: output_warm, pin: '${ww_pin}', frequency: '${pwm_frequency}', max_power: '${panel_max_power}'}

light:
  # Panel: the fixture's main light (power-on rule, Default Fade and esphome.light events from common/light/bulb.yaml)
  - platform: cwww
    id: main_light
    name: None
    cold_white: output_cold
    warm_white: output_warm
    cold_white_color_temperature: ${cold_kelvin}
    warm_white_color_temperature: ${warm_kelvin}
    constant_brightness: true
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms
    on_turn_on:
      - script.execute: bulb_event_on
    on_turn_off:
      - script.execute: bulb_event_off
    effects: !include ../../common/effects/white.yaml

  # Ring: accent, independent of the panel; off after a power cut
  - platform: neopixelbus
    id: ring
    name: Ring
    pin: ${ring_pin}
    num_leds: ${ring_leds}
    variant: ${ring_variant}
    type: ${ring_order}
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 250ms
    effects: !include ../../common/effects/addressable.yaml

# Disco Strobe: one burst of the panel's cold white at 100 % flashing at ${strobe_hz} Hz. The PWM hardware makes the
# flashes (cold output at strobe_hz, 50 % duty = 5 ms at full power, 5 ms dark), so they are exact and independent of
# the main loop and of Wi-Fi. HA turns it on for a burst and off again; the firmware ends it after strobe_max_burst
# regardless. Off restores the PWM frequency and whatever the panel light was showing. The ring is not touched.
switch:
  - platform: template
    id: disco_strobe
    name: Disco Strobe
    icon: mdi:flash
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          id(output_warm)->set_level(0.0f);
          id(output_cold)->update_frequency(${strobe_hz});
          id(output_cold)->set_level(0.5f);
      - script.execute: disco_strobe_cap
    turn_off_action:
      - script.stop: disco_strobe_cap
      - lambda: |-
          id(output_cold)->update_frequency(${pwm_frequency_hz});
          float cw = 0.0f, ww = 0.0f;
          id(main_light)->current_values_as_cwww(&cw, &ww, true);
          id(output_cold)->set_level(cw);
          id(output_warm)->set_level(ww);

script:
  - id: disco_strobe_cap
    mode: restart
    then:
      - delay: ${strobe_max_burst}
      - switch.turn_off: disco_strobe

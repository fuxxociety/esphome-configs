# Kauf RGBWW bulb (BLF10, ESP8266 1 MB) on Kauf's firmware components, with the fleet's shared bulb behaviour.
# Built from the tub's 2026-ready copy of Kauf's kauf-bulb.yaml (masterbath-tub.yaml, git tag baseline-2026.10).
#
#   kept from Kauf: kauf_rgbww light (+ warm/cold RGB calibration lights), forced_addr flash layout, WLED/DDP effect
#                   select + DDP debug, quick-boot Wi-Fi recovery, safe_mode attempts, pinned KaufHA components
#   fleet:          common/platforms/esp8285.yaml (Wi-Fi/API/OTA/diagnostics), common/light/bulb.yaml (100 % neutral
#                   white after power loss, restore after software reboot, Default Fade, esphome.light events),
#                   common/effects/color.yaml on the main light
#   decided 2026-10-31: PWM 200 Hz RGB / 400 Hz white and max power 0.85 on every Kauf bulb; quick-boot recovery
#                   needs 15 power cycles (Kauf: 9); fleet Wi-Fi settings; no web UI / web OTA / 4MiB sensor
#
# Device file:
#   substitutions: {name: bulb-masterbath-tub, friendly_name: Master Bath Tub, room_key: masterbath_shower}
#   packages:      {device: !include templates/kauf/rgbww-bulb.yaml}
substitutions:
  device_description: Kauf RGBWW bulb (BLF10)
  project_name: Kauf.RGBWW
  project_ver_num: "1.968"
  project_ver_let: y
  red_pin: GPIO4
  green_pin: GPIO12
  blue_pin: GPIO14
  cw_pin: GPIO5
  ww_pin: GPIO13
  rgb_freq: 200 Hz
  white_freq: 400 Hz
  max_power: '0.85'
  warm_white_temp: 2800 Kelvin
  cold_white_temp: 6600 Kelvin
  quick_boot_cycles: '15'      # power cycles in a row (each < 10 s) that reset Wi-Fi credentials
  safe_mode_attempts: '15'
  wifi_ap_timeout: 2min        # Kauf: AP comes up 2 min after losing Wi-Fi

packages:
  platform: !include ../../common/platforms/esp8285.yaml
  bulb: !include ../../common/light/bulb.yaml

esp8266:
  restore_from_flash: true
  start_free: 76               # Kauf flash layout (forced_addr)

external_components:
  - source:
      type: git
      url: https://github.com/KaufHA/common
      ref: v2026.10.4
    refresh: never
  - source:
      type: git
      url: https://github.com/KaufHA/kauf-rgbww-bulbs
      ref: c2026.10.1
    refresh: never

esphome:
  project:
    name: $project_name
    version: $project_ver_num($project_ver_let)
  on_boot:
    - then:
        - script.execute: script_quick_boot

globals:
  - id: global_forced_addr
    type: int
    restore_value: no
    initial_value: '12345'
  - id: global_quick_boot_count
    type: int
    restore_value: yes
    initial_value: '0'

wifi:
  forced_addr: 0               # Kauf: credentials at a fixed flash address
  ap:
    ap_timeout: ${wifi_ap_timeout}

safe_mode:
  num_attempts: ${safe_mode_attempts}

output:
  - {platform: esp8266_pwm, id: pwm_red, pin: '${red_pin}', frequency: '${rgb_freq}', max_power: '${max_power}'}
  - {platform: esp8266_pwm, id: pwm_green, pin: '${green_pin}', frequency: '${rgb_freq}', max_power: '${max_power}'}
  - {platform: esp8266_pwm, id: pwm_blue, pin: '${blue_pin}', frequency: '${rgb_freq}', max_power: '${max_power}'}
  - {platform: esp8266_pwm, id: pwm_cw, pin: '${cw_pin}', frequency: '${white_freq}', max_power: '${max_power}'}
  - {platform: esp8266_pwm, id: pwm_ww, pin: '${ww_pin}', frequency: '${white_freq}', max_power: '${max_power}'}

light:
  - platform: kauf_rgbww
    id: warm_rgb
    name: Warm RGB
    entity_category: config
    default_transition_length: 0ms
    icon: mdi:store-cog
    aux: true
    forced_hash: 4077116474
    forced_addr: 28
    disabled_by_default: ${disable_entities}
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: kauf_rgbww
    id: cold_rgb
    name: Cold RGB
    entity_category: config
    default_transition_length: 0ms
    icon: mdi:store-cog-outline
    aux: true
    forced_hash: 301094535
    forced_addr: 40
    disabled_by_default: ${disable_entities}
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: kauf_rgbww
    id: main_light
    name: None
    red: pwm_red
    green: pwm_green
    blue: pwm_blue
    warm_white: pwm_ww
    cold_white: pwm_cw
    warm_rgb: warm_rgb
    cold_rgb: cold_rgb
    warm_white_color_temperature: ${warm_white_temp}
    cold_white_color_temperature: ${cold_white_temp}
    default_transition_length: 250ms
    forced_hash: 2723974766
    forced_addr: 52
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: bulb_event_on
    on_turn_off:
      - script.execute: bulb_event_off
    effects: !include ../../common/effects/color.yaml

select:
  - platform: template
    id: effect
    name: Effect
    icon: mdi:string-lights
    entity_category: config
    optimistic: true
    options:
      - "None"
      - "WLED / DDP"
    initial_option: "None"
    restore_value: true
    forced_hash: 5841966
    forced_addr: 66
    on_value:
      - lambda: id(main_light).set_use_wled(x == "WLED / DDP");
      - script.execute: script_save_changes
  - platform: template
    id: select_ddp_debug
    name: DDP Debug
    icon: mdi:play-network
    entity_category: diagnostic
    disabled_by_default: ${disable_entities}
    optimistic: true
    options:
      - "Print no packets"
      - "Print imperfect packets"
      - "Print all packets"
    initial_option: "Print no packets"
    restore_value: false
    set_action:
      - lambda: |-
          if      ( x == "Print no packets" )        { id(main_light).set_ddp_debug(0); }
          else if ( x == "Print imperfect packets" ) { id(main_light).set_ddp_debug(1); }
          else if ( x == "Print all packets" )       { id(main_light).set_ddp_debug(2); }

script:
  - id: script_save_changes
    mode: restart
    then:
      - delay: 3s
      - lambda: global_preferences->sync();

  # Kauf quick-boot recovery: quick_boot_cycles power cycles in a row, each within 10 s of boot, wipe Wi-Fi credentials
  # so the setup AP comes up. Yellow from the 3rd quick boot, red when it fires.
  - id: script_quick_boot
    then:
      - if:
          condition:
            lambda: return ( id(global_quick_boot_count) >= ${quick_boot_cycles} );
          then:
            - lambda: |-
                ESP_LOGD("kauf-bulb", "quick boot count reached ${quick_boot_cycles}, overwriting credentials and rebooting");
                auto call = id(main_light).turn_on();
                call.set_brightness(0.6);
                call.set_rgb(1.0, 0.0, 0.0);
                call.set_save(false);
                call.perform();
                id(global_quick_boot_count) = 0;
                global_quick_boot_count->loop();
                global_preferences->sync();
            - delay: 2s
            - wait_until:
                lambda: return ( wifi::global_wifi_component->tried_loading_creds );
            - lambda: wifi::global_wifi_component->save_wifi_sta("initial_ap", "asdfasdfasdfasdf");
      - lambda: |-
          ESP_LOGD("kauf-bulb", "quick boot count is now %d, need ${quick_boot_cycles} to overwrite credentials",
                   id(global_quick_boot_count));
          id(global_quick_boot_count) += 1;
          global_quick_boot_count->loop();
          global_preferences->sync();
      - if:
          condition:
            lambda: return ( id(global_quick_boot_count) > 2 );
          then:
            - lambda: |-
                auto call = id(main_light).turn_on();
                call.set_brightness(0.5);
                call.set_rgb(1.0, 1.0, 0.0);
                call.set_save(false);
                call.perform();
      - delay: 10s
      - wait_until: wifi.connected
      - lambda: |-
          id(global_quick_boot_count) = 0;
          global_quick_boot_count->loop();
          global_preferences->sync();

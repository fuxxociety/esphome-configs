# Kauf RGBWW bulb (BLF10 / BLF15, ESP8285 1 MB), the Kauf way: Kauf's own kauf-bulb.yaml as a package, pinned, with
# the fleet layered on top only through substitutions, !extend and added entities (2026-11-04). Kauf's features are
# kept as they ship: kauf_rgbww light with Warm/Cold RGB calibration lights, phase-locked 250 Hz PWM, WLED/DDP effect
# select + DDP debug, Kauf web UI with web OTA, captive portal, quick-boot Wi-Fi recovery, 4MiB sensor.
#
#   fleet:  Wi-Fi/API/OTA secrets and Wi-Fi tuning (common/wifi.yaml values), UART logger off, HA + SNTP time,
#           diagnostics (Wi-Fi signal, SSID/BSSID/MAC, firmware version, API status), common/light/bulb.yaml
#           (100 % neutral white after power loss, Default Fade, esphome.light events), common/effects/color.yaml
#   decided: quick-boot recovery needs 15 power cycles (Kauf: 9); max power 0.85 (Kauf: 0.8)
#
# White channels dark at every colour temperature (all Kauf bulbs, 2026-11-04, Kauf's own 2.00 binary too): a saved
# main-light white term of 0 (see script kauf_white_term_fix below); a /reset wipe also clears it, this doesn't need one.
#
# Device file:
#   substitutions: {name: bulb-masterbath-tub, friendly_name: Master Bath Tub, room_key: masterbath_shower}
#   packages:      {device: !include templates/kauf/rgbww-bulb.yaml}
substitutions:
  device_description: Kauf RGBWW bulb
  disable_entities: 'true'
  wifi_ap_timeout: 2min
  sub_reboot_req: '15'
  sub_max_power: '0.85'
  sub_on_turn_on: bulb_event_on
  sub_on_turn_off: bulb_event_off
  light_id: kauf_light
  # fleet Wi-Fi (common/wifi.yaml)
  wifi_power: '17'
  wifi_fast_connect: 'false'
  wifi_reboot_timeout: 10min
  wifi_roaming: 'false'
  time_timezone: America/Chicago

packages:
  kauf: github://KaufHA/kauf-rgbww-bulbs/kauf-bulb.yaml@ee1d4b2b0648252df7a4a1f3a332093eee7adee1
  bulb: !include ../../common/light/bulb.yaml
  time: !include ../../common/time.yaml

esphome:
  comment: ${device_description}
  # power-on vs software-reboot detection (BEHAVIOR.md §0.5)
  includes:
    - common/boot/power.h
  on_boot:
    - priority: 590   # after the light restored its state (and bulb.yaml's power-on white at 600)
      then:
        - script.execute: kauf_white_term_fix

api:
  encryption:
    key: !secret api_enc_key

ota:
  - id: !extend kauf_esphome_ota
    password: !secret esphome_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_dns_domain
  output_power: ${wifi_power}
  fast_connect: ${wifi_fast_connect}
  reboot_timeout: ${wifi_reboot_timeout}
  post_connect_roaming: ${wifi_roaming}
  ap:
    ssid: ${friendly_name} AP
    password: !secret ap_password

logger:
  baud_rate: 0

light:
  - id: !extend kauf_light
    effects: !include ../../common/effects/color.yaml
    on_state:
      - script.execute: kauf_white_term_fix

script:
  # Kauf's light fork computes colour-temperature output as state * brightness * white (light_color_values.h as_ct),
  # but its LightCall drops any white > 0 in RGB/CT modes and lets 0 through. Once a 0 is saved (flash, Main Light at
  # forced_addr 52) both white channels stay dark at every colour temperature until a full wipe; RGB still works.
  # Seen 2026-11-04 on every Kauf bulb. Put the white term back to 1 and save it, without touching anything else.
  - id: kauf_white_term_fix
    then:
      - lambda: |-
          auto *l = id(kauf_light);
          if (l->remote_values.get_white() >= 0.999f && l->current_values.get_white() >= 0.999f) return;
          ESP_LOGW("kauf", "white term was %.2f: reset to 1 (colour temperature output is multiplied by it)",
                   l->remote_values.get_white());
          l->remote_values.set_white(1.0f);
          l->current_values.set_white(1.0f);
          l->save_remote_values_();
          l->set_next_write();

button:
  - id: !extend restart_button
    name: Restart

# fleet diagnostics (common/diagnostics.yaml) that Kauf doesn't already have (it has Uptime, IP Address, Restart)
binary_sensor:
  - platform: status
    id: api_status
    name: API Status
    disabled_by_default: ${disable_entities}

sensor:
  - platform: wifi_signal
    id: sensor_wifi_signal
    name: WiFi Signal
    update_interval: 300s
    disabled_by_default: ${disable_entities}
    on_value:
      - component.update: sensor_wifi_signal_percentage
  - platform: template
    id: sensor_wifi_signal_percentage
    name: WiFi Signal Percentage
    icon: mdi:wifi
    unit_of_measurement: '%'
    entity_category: diagnostic
    disabled_by_default: ${disable_entities}
    update_interval: never
    lambda: |-
      float rssi = id(sensor_wifi_signal).state;
      if (std::isnan(rssi)) return NAN;
      return std::clamp(2.0f * (rssi + 100.0f), 0.0f, 100.0f);

text_sensor:
  - platform: wifi_info
    ssid:
      name: Connected SSID
      disabled_by_default: ${disable_entities}
    bssid:
      name: Connected BSSID
      disabled_by_default: ${disable_entities}
    mac_address:
      name: Connected MAC
      disabled_by_default: ${disable_entities}
  - platform: version
    name: Firmware Version
    hide_timestamp: true
    entity_category: diagnostic
    disabled_by_default: ${disable_entities}

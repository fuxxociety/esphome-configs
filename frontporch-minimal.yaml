# Two-step OTA helper for frontporch (Treatlife SS01S, ESP-12E).
#
# The running 2025.3.3 image is too large to fit next to the new full image, so OTA fails at
# "prepare" and the old firmware's ota on_error reboots the switch. Flash this small image
# first, then front-porch.yaml. Same name, OTA password and Wi-Fi, so it keeps its DHCP lease.
# While this image is on the device, Home Assistant will show it unavailable (no api).
esphome:
  name: frontporch

esp8266:
  board: esp12e

logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_dns_domain
  use_address: 10.10.32.95
  reboot_timeout: 0s   # stay up and reachable for the second OTA, whatever happens

ota:
  - platform: esphome
    password: !secret esphome_ota_password

safe_mode:

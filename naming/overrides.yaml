  new_hostname: bulb-masterbed-shelf
  friendly_name: Master Bed Shelf
  room_key: masterbed_shelf
"Bulb-Livingroom-Shelf":
  friendly_name: Living Room Shelf
  room_key: livingroom_shelf

"growlight":
  new_hostname: light-livingroom-grow
  friendly_name: Living Room Grow
  room_key: livingroom_grow
# Hand-tuned Minoston plug: keep the friendly name so every washingmachine_* entity id stays exactly as it is
# (used by start_washing_machine_timer, utility_appliances_notification, clothes_notification_*)
"Plug-Washingmachine":
  class: plug_appliance
  new_hostname: plug-washingmachine
  friendly_name: WashingMachine
# Treatlife SS01S relay switch (ESP8266MOD 4 MB), formerly the office fan switch; a test spare since 2026-11-01
"Switch-Office-Fan":

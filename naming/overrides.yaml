# Hand decisions for tools/rename_map.py draft, keyed by the HA device name.
# `hostname` = the live device's CURRENT hostname (picks its config); any other key overrides the proposal.
"Front Porch":
  hostname: frontporch            # front-porch.yaml; "Front Porch" is also the porch bulb's friendly name
"Upstairs 3-Way":
  hostname: upstairs-3w-light-switch
"Office-Light-Switch":
  room_key: officeceiling         # HA has script.single_press_officeceiling and light.group_officeceiling

# No longer on the aquarium: plug feeding a bright "wash" light in the craft room. Not driven by the wall switch's
# smart-mode loop; candidate for the craft room switch's double-press (BEHAVIOR.md §5). Exposes a light (representative).
"Aquarium Light Outlet":
  class: plug_light
  new_hostname: plug-craftroom-wash-1
  friendly_name: Craft Room Wash 1
  room_key: craftroom_wash
"Kauf Plug 44ed55":               # the other craft room wash light
  class: plug_light
  new_hostname: plug-craftroom-wash-2
  friendly_name: Craft Room Wash 2
  room_key: craftroom_wash

# plug-masterbedroom-fan (Enbrighten WFD4105, BK7231T, MAC 10:5a:17:b7:05:14, 10.10.32.100, ESPHome 2024.4.1): LIVE but
# unused, empty by the window in Mason's room, never in HA (so no HA name to key an override by). The draft flagged it
# stale; on 2026-11-01 it was included as plug-mason-spare ("Mason Spare Plug", room_key mason_spare), edited directly
# in naming.yaml - re-apply that if the draft is regenerated.

# fan-office-ceiling (the dimmer-office-ceiling entry): since 2026-11-01 a Tuya WB3S (BK7231T, MAC d8:1f:12:29:87:5a)
# on a DS01C board. Never in HA under a name, so edited directly in naming.yaml (mac, live: true,
# template: templates/treatlife/ds01c-fan-wb3s.yaml) - re-apply if the draft is regenerated.

# Unreachable, retired (2026-10-31): left out of the refactor, HA entries untouched
"Kauf-Bulb-302342": {retire: true}
"Kauf-Bulb-30288A": {retire: true}
"Kauf-Bulb-302E9A": {retire: true}
"Kauf-Bulb-304Cc4": {retire: true}

# Shower fixture and tub bulb are both powered by the master bath shower wall switch -> same room_key
"Masterbath Shower Fixture":
  new_hostname: light-masterbath-shower
  friendly_name: Master Bath Shower Fixture
  room_key: masterbath_shower
"Masterbath Tub":
  new_hostname: bulb-masterbath-tub
  friendly_name: Master Bath Tub
  room_key: masterbath_shower

# Standalone bulbs, no wall switch

---
# Wi-Fi component package
#
# Contains my common Wi-Fi setup.
#
# https://esphome.io/components/wifi.html
#
# The defaults below match what the 2024.x fleet actually ran (the old file defined
# wifi_fast_connect / wifi_reboot_timeout but hard-coded other values in the block).
substitutions:
  wifi_dns_domain: !secret wifi_dns_domain
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  wifi_power: '17'
  wifi_ap_password: !secret ap_password
  wifi_fast_connect: 'false'  # ESPHome default: false
  wifi_reboot_timeout: 10min  # ESPHome default: 15min

wifi:
  domain: "${wifi_dns_domain}"
  id: component_wifi
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  output_power: ${wifi_power}
  fast_connect: ${wifi_fast_connect}
  reboot_timeout: ${wifi_reboot_timeout}
  ap:
    ssid: "${friendly_name} AP"
    password: "${wifi_ap_password}"

sensor:
  - <<: !include ../sensors/wifi_signal_percentage.yaml
  - <<: !include ../sensors/wifi_signal.yaml
    on_value:
      - component.update: sensor_wifi_signal_percentage

text_sensor:
  - <<: !include ../text_sensors/wifi_info.yaml

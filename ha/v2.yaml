      value_template: '{{ step == ''off'' and r.off_also | count > 0 }}'
    then:
    - repeat:
        for_each: '{{ r.off_also }}'
        sequence:
        - action: script.v2_room_off
          data:
            room: '{{ repeat.item }}'
  - if:
    - condition: template
      value_template: '{{ step != ''off'' and r.on_script is not none }}'
    then:
    - delay:
        seconds: 3
    - action: '{{ r.on_script }}'
- id: v2_room_double_press
  alias: '[v2] Room double press'
  description: 'New-firmware switches: toggle the room''s `double` target from config/ha/rooms.yaml.'
  mode: parallel
  max: 10
  triggers:
  - trigger: event
    event_type: esphome.double
    event_data:
      action: double_press
  variables:
    rooms: *id001
    by_group: *id002
    by_switch: *id003
    by_timer: *id004
    room: '{{ trigger.event.data.room | default('''') }}'
    r: '{{ rooms.get(room, {}) }}'
  conditions:
  - condition: template
    value_template: '{{ room in rooms and r.double is not none }}'
  actions:
  - action: light.toggle
    target:
      entity_id: '{{ r.double }}'
- id: v2_room_timer_finished
  alias: '[v2] Room timer finished'
  description: 'Turns a migrated room off when its timer finishes (old: Timer Expired (multiple), which still handles rooms whose switch isn''t migrated).'
  mode: parallel
  max: 10
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.downbath_vent
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.laundryroom_light
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.masterbath_shower_vent
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.masterbath_toilet_vent
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.upbath_toilet
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.upbath_vanity
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.upbath_vent
  variables:
    rooms: *id001
    by_group: *id002
    by_switch: *id003
    by_timer: *id004
    room: '{{ by_timer.get(trigger.event.data.entity_id, '''') }}'
  conditions:
  - condition: template
    value_template: '{{ room != '''' }}'
  actions:
  - action: script.v2_room_off
    data:
      room: '{{ room }}'
- id: v2_room_mirror
  alias: '[v2] Room to switch mirror'
  description: 'Method C: in smart mode (Relay Config = Always On) the switch''s light follows the room group''s on/off, brightness and colour, from any source. Its
    status LED shows it.'
  mode: queued
  max: 20
  triggers:
  - trigger: state
    entity_id:
    - light.group_diningroom
    - light.group_frontentry
    - light.group_frontporch
    - light.group_livingroom
    - light.group_masterbath_shower
    - light.group_masterbath_toilet
    - light.group_masterbed
    - light.group_officeceiling
    not_to:
    - unavailable
    - unknown
  variables:
    rooms: *id001
    by_group: *id002
    by_switch: *id003
    by_timer: *id004
    group: '{{ trigger.entity_id }}'
    room: '{{ by_group[trigger.entity_id] }}'
  conditions: []
  actions:
  - repeat:
      for_each: '{{ rooms[room].switches | selectattr(''entity'', ''match'', ''light\\.'') | list }}'
      sequence:
      - condition: template
        value_template: '{{ states[repeat.item.entity] is not none and repeat.item.mode is not none and is_state(repeat.item.mode, ''Always On'') }}'
      - if:
        - condition: template
          value_template: '{{ trigger.to_state.state == ''off'' }}'
        then:
        - condition: template
          value_template: '{{ is_state(repeat.item.entity, ''on'') }}'
        - action: light.turn_off
          target:
            entity_id: '{{ repeat.item.entity }}'
          data:
            transition: 0
        else:
        - action: light.turn_on
          target:
            entity_id: '{{ repeat.item.entity }}'
          data: '{% set d = {''transition'': 0, ''brightness'': trigger.to_state.attributes.brightness | int(255)} %}{% if trigger.to_state.attributes.color_mode
            in [''rgb'', ''rgbw'', ''rgbww'', ''hs'', ''xy''] and trigger.to_state.attributes.rgb_color %}{% set d = dict(d, rgb_color=trigger.to_state.attributes.rgb_color
            | list) %}{% elif trigger.to_state.attributes.color_temp_kelvin %}{% set d = dict(d, color_temp_kelvin=trigger.to_state.attributes.color_temp_kelvin)
            %}{% endif %}{{ d }}'
- id: v2_switch_to_room
  alias: '[v2] Switch to room'
  description: A person changing a smart-mode switch's light (dashboard, voice) applies it to the room group. Changes made by the mirror or by the switch's own button
    aren't forwarded.
  mode: queued
  max: 20
  triggers:
  - trigger: state
    entity_id:
    - light.dining_room
    - light.front_entry
    - light.front_porch
    - light.living_room
    - light.master_bath_shower
    - light.master_bath_toilet
    - light.master_bed
    - light.office
    not_to:
    - unavailable
    - unknown
  variables:
    rooms: *id001
    by_group: *id002
    by_switch: *id003
    by_timer: *id004
    room: '{{ by_switch[trigger.entity_id] }}'
    sw: '{{ rooms[room].switches | selectattr(''entity'', ''eq'', trigger.entity_id) | first }}'
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.context.user_id is not none }}'
  - condition: template
    value_template: '{{ sw.mode is not none and is_state(sw.mode, ''Always On'') }}'
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.to_state.state == ''off'' }}'
    then:
    - action: light.turn_off
      target:
        entity_id: '{{ rooms[room].group }}'
    else:
    - action: light.turn_on
      target:
        entity_id: '{{ rooms[room].group }}'
      data: '{% set d = {''brightness'': trigger.to_state.attributes.brightness | int(255)} %}{% if trigger.to_state.attributes.color_mode == ''rgb'' %}{% set d =
        dict(d, rgb_color=trigger.to_state.attributes.rgb_color | list) %}{% elif trigger.to_state.attributes.color_temp_kelvin %}{% set d = dict(d, color_temp_kelvin=trigger.to_state.attributes.color_temp_kelvin)
        %}{% endif %}{{ d }}'
- id: v2_room_power_up
  alias: '[v2] Room power-up'
  description: 'BEHAVIOR.md section 0.5: the room group is turned on while its bulbs are unpowered (smart-mode switch with its relay open), so turn the switch''s
    light on, which energises the relay; the bulbs come up at 100 %.'
  mode: parallel
  max: 10
  triggers:
  - trigger: event
    event_type: call_service
    event_data:
      domain: light
      service: turn_on
  variables:
    rooms: *id001
    by_group: *id002
    by_switch: *id003
    by_timer: *id004
    targets: '{% set e = trigger.event.data.service_data.entity_id | default([]) %}{{ [e] if e is string else e }}'
    hit: '{{ by_group.items() | selectattr(''0'', ''in'', targets) | map(attribute=''1'') | list }}'
  conditions:
  - condition: template
    value_template: '{{ hit | count > 0 }}'
  actions:
  - repeat:
      for_each: '{{ hit }}'
      sequence:
      - condition: template
        value_template: '{{ expand(rooms[repeat.item].group) | rejectattr(''state'', ''eq'', ''unavailable'') | list | count == 0 }}'
      - repeat:
          for_each: '{{ rooms[repeat.item].switches | selectattr(''entity'', ''match'', ''light\\.'') | list }}'
          sequence:
          - condition: template
            value_template: '{{ states[repeat.item.entity] is not none and repeat.item.mode is not none and is_state(repeat.item.mode, ''Always On'') and is_state(repeat.item.entity,
              ''off'') }}'
          - action: light.turn_on
            target:
              entity_id: '{{ repeat.item.entity }}'
script:
  v2_room_step:
    alias: '[v2] Room step'
    description: Apply a smart-mode step (bright/medium/low/night/off) to every available light in a group, by capability. Same values as script.single_press_global
      and the switch firmware.
    mode: parallel
    max: 20
    fields:
      group:
        description: light group entity
      step:
        description: bright|medium|low|night|off
    sequence:
    - variables:
        lights: '{{ expand(group) | rejectattr(''state'', ''in'', [''unavailable'', ''unknown'']) | map(attribute=''entity_id'') | list }}'
        pct: '{{ {''bright'': 100, ''medium'': 66, ''low'': 33}.get(step, 100) }}'
    - condition: template
      value_template: '{{ lights | count > 0 }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ step == ''off'' }}'
        sequence:
        - action: light.turn_off
          target:
            entity_id: '{{ lights }}'
      default:
      - repeat:
          for_each: '{{ lights }}'
          sequence:
          - variables:
              modes: '{{ (state_attr(repeat.item, ''supported_color_modes'') or []) | map(''regex_replace'', ''^'', '''') | list }}'
              colour: '{{ modes | select(''in'', [''rgb'', ''rgbw'', ''rgbww'', ''hs'', ''xy'']) | list | count > 0 }}'
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ step == ''night'' and colour }}'
              sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  brightness_pct: 100
                  rgb_color:
                  - 255
                  - 10
                  - 185
            - conditions:
              - condition: template
                value_template: '{{ step == ''night'' }}'
              sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  brightness_pct: 10
            - conditions:
              - condition: template
                value_template: '{{ ''color_temp'' in modes }}'
              sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  brightness_pct: '{{ pct }}'
                  color_temp_kelvin: 3333
            - conditions:
              - condition: template
                value_template: '{{ ''white'' in modes }}'
              sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  white: '{{ (pct * 2.55) | round(0) | int }}'
            default:
            - action: light.turn_on
              target:
                entity_id: '{{ repeat.item }}'
              data:
                brightness_pct: '{{ pct }}'
  v2_room_off:
    alias: '[v2] Room off'
    description: 'Turn a migrated room off: its group and its switches'' light/fan. Rooms whose switch isn''t migrated are left to the old automations (script.event_to_switch).'
    mode: parallel
    max: 20
    fields:
      room:
        description: room_key
    sequence:
    - variables:
        rooms: *id001
        r: '{{ rooms.get(room, {''switches'': [], ''group'': none}) }}'
        live: '{{ r.switches | map(attribute=''entity'') | select(''in'', states | map(attribute=''entity_id'') | list) | list }}'
    - condition: template
      value_template: '{{ live | count > 0 }}'
    - if:
      - condition: template
        value_template: '{{ r.group is not none }}'
      then:
      - action: light.turn_off
        target:
          entity_id: '{{ r.group }}'
    - action: homeassistant.turn_off
      target:
        entity_id: '{{ live }}'

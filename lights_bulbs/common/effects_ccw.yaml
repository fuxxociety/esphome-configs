api:
  services:
    - service: variable_brightness
      variables:
        brightness: string
      then:
        - logger.log: "Received brightness command"
        - if:
            condition:
              lambda: 'return brightness == "candle";'
            then:
              - script.execute: effect_candle
        - if:
            condition:
              lambda: 'return brightness == "warm";'
            then:
              - script.execute: effect_warm
        - if:
            condition:
              lambda: 'return brightness == "natural";'
            then:
              - script.execute: effect_natural
        - if:
            condition:
              lambda: 'return brightness == "bright";'
            then:
              - script.execute: effect_bright
        - if:
            condition:
              lambda: 'return brightness == "medium";'
            then:
              - script.execute: effect_medium
        - if:
            condition:
              lambda: 'return brightness == "low";'
            then:
              - script.execute: effect_low
        - if:
            condition:
              lambda: 'return brightness == "snow";'
            then:
              - script.execute: effect_snow


# CW/WW effects
# https://esphome.io/guides/automations.html#script-component
script:

  - id: effect_candle
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          # TBD

  - id: effect_warm
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 100%
          # white: 100%
          color_temperature: 500 mireds
          # red: 100%
          # green: 100%
          # blue: 100%

  - id: effect_natural
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 100%
          # white: 100%
          color_temperature: 327 mireds
          # red: 100%
          # green: 100%
          # blue: 100%

  - id: effect_bright
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 100%
          # white: 100%
          color_temperature: 260 mireds
          # red: 100%
          # green: 100%
          # blue: 100

  - id: effect_medium
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 60%
          # white: 100%
          color_temperature: 260 mireds
          # red: 100%
          # green: 100%
          # blue: 100

  - id: effect_low
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 30%
          # white: 100%
          color_temperature: 260 mireds
          # red: 100%
          # green: 100%
          # blue: 100

  - id: effect_snow
    then:
      - light.turn_on:
          id: ${friendly_type}${device_num}
          brightness: 100%
          # white: 100%
          color_temperature: 153 mireds
          # red: 100%
          # green: 100%
          # blue: 100%

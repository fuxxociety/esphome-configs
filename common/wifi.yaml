# https://esphome.io/components/wifi.html
# Defaults equal what the fleet ran (modules/components/common/wifi.yaml); see README.md of the debug project
# for the UniFi side. A Wi-Fi reboot is a *software* reboot, so it restores state (BEHAVIOR.md §0.5).
substitutions:
  wifi_power: '17'
  wifi_fast_connect: 'false'
  wifi_reboot_timeout: 10min
  # Off: 2025+ ESPHome rescans after connecting and roams to a stronger AP. On ESP8266 every scan and roam drops the
  # link (the shower fixture dropped 12x in 3 h with it on); the old fleet (2024.4) never roamed.
  wifi_roaming: 'false'

wifi:
  id: component_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_dns_domain
  output_power: ${wifi_power}
  fast_connect: ${wifi_fast_connect}
  reboot_timeout: ${wifi_reboot_timeout}
  post_connect_roaming: ${wifi_roaming}
  ap:
    ssid: ${friendly_name} AP
    password: !secret ap_password

# Behaviour every smart bulb shares (BEHAVIOR.md §0.5, §6). The bulb template names its light `main_light` and
# calls scripts bulb_event_on / bulb_event_off from the light's on_turn_on / on_turn_off.
#
# Power loss: utility power returning (or the wall switch's relay closing) brings the bulb up at 100 % neutral white,
# so a bulb behind a dumb or fallen-back switch always works. A software reboot restores the previous state.
substitutions:
  # Default Fade's first value (ms); the bulb keeps any value set later. Templates may raise it (see sm2335-rgbww.yaml).
  default_fade_ms: '250'

esphome:
  on_boot:
    - priority: 600   # after the light restored its saved state, before Wi-Fi
      then:
        - if:
            condition:
              lambda: return fleet::power_on_reset();
            then:
              - lambda: |-
                  ESP_LOGI("power", "power-on reset: 100 %% neutral white");
                  auto call = id(main_light).turn_on();
                  call.set_brightness(1.0f);
                  if (id(main_light)->get_traits().supports_color_capability(light::ColorCapability::COLOR_TEMPERATURE) ||
                      id(main_light)->get_traits().supports_color_capability(light::ColorCapability::COLD_WARM_WHITE)) {
                    call.set_color_temperature(300);       // single_press_global "bright"
                  } else if (id(main_light)->get_traits().supports_color_capability(light::ColorCapability::WHITE)) {
                    call.set_white(1.0f);
                    call.set_rgb(0.0f, 0.0f, 0.0f);
                  }
                  call.set_transition_length(0);
                  call.perform();

number:
  # transition used when HA doesn't give one (was 250 ms hard-coded on some bulbs, a number on others)
  - platform: template
    id: number_default_fade
    name: Default Fade
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: ms
    mode: box
    min_value: 0
    max_value: 5000
    step: 50
    initial_value: ${default_fade_ms}
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(main_light)->set_default_transition_length(x);

script:
  # "Bulbs trigger Switch indicators" listens for esphome.light with device_id = the room key
  - id: bulb_event_on
    then:
      - homeassistant.event:
          event: esphome.light
          data: {device_id: '${room_key}', devicename: '${room_key}', room: '${room_key}', action: 'on'}
  - id: bulb_event_off
    then:
      - homeassistant.event:
          event: esphome.light
          data: {device_id: '${room_key}', devicename: '${room_key}', room: '${room_key}', action: 'off'}

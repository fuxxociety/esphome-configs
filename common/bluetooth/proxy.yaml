# BLE tracker + active Bluetooth proxy for HA (ESP32 only), included by common/platforms/esp32*.yaml, so every ESP32
# is a proxy (Bermuda room/floor presence). ESPHome's default scan parameters, as its docs recommend for proxies:
# interval 320 ms, window = interval with Wi-Fi, software coexistence on (Wi-Fi keeps its share of the radio).
# The old growlight config ran 1100/1100 ms by hand. Single-core ESP32-C3 (stairwell 3-way legs): watch Wi-Fi;
# ESPHome's documented workaround is continuous: false + scanning only while an API client is connected.
# Device files add their own BLE sensors (e.g. ble_rssi for a phone) on top.
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

# BLE tracker + active Bluetooth proxy for HA (ESP32 only). Scan window <= 600 ms as ESPHome recommends: the
# growlights ran 1100/1100 ms (100 % radio time), which starves Wi-Fi on the shared radio.
# Device files add their own BLE sensors (e.g. ble_rssi for a phone) on top.
substitutions:
  ble_scan_interval: 320ms
  ble_scan_window: 300ms

esp32_ble_tracker:
  scan_parameters:
    interval: ${ble_scan_interval}
    window: ${ble_scan_window}
    active: true

bluetooth_proxy:
  active: true

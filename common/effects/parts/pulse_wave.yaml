addressable_lambda:
  name: Pulse Wave
  update_interval: 50ms
  lambda: |-
    static float step = 0.0f;
    step += 0.3f;
    for (int i = 0; i < it.size(); i++) {
      const float scale = (sinf(i * 0.3f + step) + 1.0f) / 2.0f;
      it[i] = Color(current_color.red * scale, current_color.green * scale, current_color.blue * scale);
    }

###################################
# Treatlife Dimmer Switch DS01C
###################################
# GPIO03: tuya_uart RX
# GPIO01: tuya_uart TX
# GPIO13: button (inverted)
###################################
---
substitutions:
  nameprefix: "dimmer-"
  device_description: 'Treatlife DS01C Dimming Wall Switch'

  appliance_name: Treatlife.DS01C
  appliance_model: "ESP-12E"

  # button press substitutions
  sub_double_press_max_gap: 333ms
  sub_hold_time: 750ms
  sub_button_sensor_duration: 500ms

packages:
  esp: !include ../modules/ESP8266.yaml

esp8266:
  restore_from_flash: true
  early_pin_init: false

esphome:
  project:
    name: $appliance_name
    version: $appliance_model

ota:
  - id: !extend my_ota
    on_error:
      then:
        - button.press: restart_button

uart:
  rx_pin: GPIO03
  tx_pin: GPIO01
  baud_rate: 9600

tuya:
  id: tuyamcu
# Switch datapoint is: 1
# Dimmer datapoint is: 2
#   Dimmer is int; 148 to 1000

button:
  - platform: template
    id: test1
    name: $friendly_name Single Click
    disabled_by_default: true
    on_press:
      then:
        - lambda: |-
            id(script_hass_toggle_single_press).execute();

binary_sensor:
  - platform: gpio
    id: main_button
    name: $friendly_name Button
    pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
      inverted: true
    on_multi_click:
      # definition for single press
    - timing:
        - ON for at most $sub_hold_time
        - OFF for at least $sub_double_press_max_gap
      invalid_cooldown: 1000ms
      then:
        - lambda: |-
            id(script_hass_toggle_single_press).execute();

      # definition for double press
    - timing:
        - ON for at most $sub_hold_time
        - OFF for at most $sub_double_press_max_gap
        - ON for at least 1ms
      then:
        - lambda: |-
            id(script_hass_toggle_double_press).execute();

      # definition for holding
    - timing:
        - ON for at least $sub_hold_time
      then:
        - lambda: |-
            id(script_hass_toggle_hold).execute();

      # definition for release without hold
    - timing:
        - ON for at most $sub_hold_time
      then:
        - lambda: |-
            id(script_hass_toggle_release_without_hold).execute();

      # definition for 30s hold to clear credentials
    - timing:
        - ON for at least 30s
      then:
      - logger.log: "------------------->>>>>>>>>>>>>>>>>   HELD BUTTON 30 SECONDS, FORCING AP"

light:
  - platform: tuya
    id: ui_switch
    name: ${friendly_name} Fan
    icon: "mdi:fan"
    switch_datapoint: 1
    dimmer_datapoint: 2
    min_value_datapoint: 3
    max_value: 1000

script:
  - id: script_save_changes
    mode: restart
    then:
      - delay: 3s
      - lambda: global_preferences->sync();
  - id: script_hass_toggle_single_press
    then:
      - homeassistant.event:
          event: esphome.single
          data:
            device_id: $friendly_name
            action: single_press
      - light.toggle: ui_switch
  - id: script_hass_toggle_double_press
    then:
      homeassistant.event:
        event: esphome.double
        data:
          device_id: $friendly_name
          action: double_press
  - id: script_hass_toggle_hold
    then:
      homeassistant.event:
        event: esphome.hold
        data:
          device_id: $friendly_name
          action: hold
  - id: script_hass_toggle_release_without_hold
    then:
      homeassistant.event:
        event: esphome.release_without_hold
        data:
          device_id: $friendly_name
          action: release_without_hold

    ip_address:
      name: $friendly_name IP Address
      disabled_by_default: $disable_entities
  - platform: homeassistant
    id: stairs_3w_select_brightness
    name: Stairs 3-Way Brightness
    entity_id: input_select.stairs_3w_select_brightness
    internal: false
    on_value:
      then:
        - lambda: |-
            id(script_toggle_modes).execute();

switch:
  # relay output
  - platform: gpio
    id: relay
    name: $friendly_name
    pin: $sub_relay_pin
    entity_category: ''
#    forced_hash: 41191675
#    forced_addr: 2
#    global_addr: global_forced_addr
    restore_mode: $sub_restore_mode
    on_turn_on:
      - logger.log: "Relay turned on!"
      - script.execute: script_set_power_leds
      - script.execute: $sub_on_turn_on
    on_turn_off:
      - logger.log: "Relay turned off!"
      - script.execute: script_set_power_leds
      - script.execute: $sub_on_turn_off

    # https://esphome.io/components/switch/template.html
  - platform: template
    id: switch_no_hass
    name: $friendly_name No HASS
    optimistic: true
    entity_category: config
    disabled_by_default: $disable_entities
    icon: mdi:toggle-switch-off-outline
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: |-
          id(kauf_api).set_reboot_timeout(0);  // 0 disables auto rebooting and also new status led blinking.  doesn't stop current status led blinking
          id(kauf_api).status_clear_warning(); // stops current status led blinking, timeout 0 keeps it from restarting
      - script.execute: script_save_changes
    on_turn_off:
      - lambda: id(kauf_api).set_reboot_timeout(900000);
      - script.execute: script_save_changes
#    forced_hash: 657159011
#    forced_addr: 42
#    global_addr: global_forced_addr

  - platform: template
    id: white_led
    name: $friendly_name White LED
    optimistic: true
    entity_category: config
    disabled_by_default: $disable_entities
    icon: mdi:led-outline
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(white_led_pwm).set_level(id(white_led_brightness).state/100);
    on_turn_off:
      - lambda: id(white_led_pwm).set_level(0.0);
#    forced_hash: 1329407616
#    forced_addr: 44
#    global_addr: global_forced_addr

  - platform: template
    id: red_led
    name: $friendly_name Red LED
    optimistic: true
    entity_category: config
    disabled_by_default: $disable_entities
    icon: mdi:led-outline
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(red_led_pwm).set_level(id(red_led_brightness).state/100);
    on_turn_off:
      - lambda: id(red_led_pwm).set_level(0.0);
#    forced_hash: 261191305
#    forced_addr: 48
#    global_addr: global_forced_addr

  - platform: template
    name: "${friendly_name} Switch"
    id: ui_switch
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: false
    lambda: |-
      // UI switch should check that the circuit has power in 'dumb' state, or
      // if in 'smart' state should be triggered by select_brightness setting
      // waiting for select entity to have a state keeps the relay from toggling during boot
      if ( id(power_sensor).has_state() && id(power_sensor).state ) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
    - if:
        condition:
          - binary_sensor.is_off: power_sensor
        then:
          - lambda: |-
              id(relay).turn_on();
              // (indicator) switch is on, copy on values
              auto call = id(white_led).make_call();
              call.set_state(true);
              call.set_brightness(1.0);
              call.perform();
          - script.execute: script_save_changes
    turn_off_action:
    - if:
        condition:
          - binary_sensor.is_on: power_sensor
        then:
          - logger.log: "Template Switch turned off with power_sensor on"
          - lambda: |-
              id(relay).turn_off();
              // (indicator) switch is off, copy off values
              auto call = id(white_led).make_call();
              call.set_state(false);
              call.perform();
          - script.execute: script_save_changes


  - platform: ledc
    pin: $sub_red_led_pin
    frequency: 250 Hz
    id: red_led_pwm
    inverted: true
    # white light pwm
  - platform: ledc
    pin: $sub_white_led_pin
    frequency: 250 Hz
    id: white_led_pwm
    min_power: 10%
    inverted: true


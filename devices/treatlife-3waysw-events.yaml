  id: component_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: '17'
  reboot_timeout: 5min
  ap:
    ssid: "${friendly_name} AP"
    password: !secret ap_password
    ap_timeout: 2147483647ms  # maximum 32 bit value.  About 3.5 weeks in milliseconds.

---
# Wi-Fi component package
#
# Contains my common Wi-Fi setup.
#
# https://esphome.io/components/wifi.html

substitutions:
  wifi_ap_timeout: 2min     # default to 2 minute timeout for yaml file as package.
  wifi_fast_connect: 'true' # default: false
  wifi_reboot_timeout: 5min # default: 15min

wifi:
  domain: !secret wifi_dns_domain
  id: component_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 10min
  output_power: ${wifi_tx_power}
  ap:
    ssid: AP
    password: !secret ap_password

sensor:
  - <<: !include wifi/wifi_signal_percentage.yaml
  - <<: !include wifi/sensor_wifi_signal.yaml
    on_value:
      - component.update: sensor_wifi_signal_percentage

text_sensor:
  - <<: !include wifi/textsensor_wifi_info.yaml

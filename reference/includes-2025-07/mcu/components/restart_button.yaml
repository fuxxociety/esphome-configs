---
# Restart Button
# https://esphome.io/components/button/restart.html
substitutions:
  friendly_type: ''

button:
  - platform: restart
    id: restart_button
    name: Restart Firmware
    entity_category: diagnostic
    disabled_by_default: $disable_entities

ota:
  - id: !extend my_ota
    on_error:
      then:
        - button.press: restart_button

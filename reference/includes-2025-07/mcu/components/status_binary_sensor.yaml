---
# Status Sensor
# The Status Binary Sensor exposes the node state (if it’s connected to via MQTT/native API) for Home Assistant.
#
# https://esphome.io/components/binary_sensor/status.html
substitutions:
  friendly_type: ''

binary_sensor:
  - platform: status
    name: API Connection Status
    id: homeassistant_status
    disabled_by_default: $disable_entities

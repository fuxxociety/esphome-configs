---
# Version Text Sensor
#
# The version text sensor platform exposes the ESPHome version the firmware was
# compiled against as a text sensor.
#
# https://esphome.io/components/text_sensor/version.html
#
substitutions:
  friendly_type: ''

text_sensor:
  - platform: version
    id: text_sensor_version
    name: Firmware Version
    hide_timestamp: true

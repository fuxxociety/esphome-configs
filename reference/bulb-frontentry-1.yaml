# https://esphome.io/guides/automations.html#script-component
script:
  - id: script_save_changes
    mode: restart
    then:
      - delay: 3s
      - lambda: global_preferences->sync();

  - id: script_do_nothing
    then:
      lambda: return;

  - id: effect_red
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
          # white: 0%
  - id: effect_blue
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 100%
          red: 0%
          green: 0%
          blue: 100%
          # white: 0%
  - id: effect_green
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 100%
          red: 0%
          green: 100%
          blue: 0%
          # white: 0%
  - id: effect_yellow
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 100%
          red: 100%
          green: 100%
          blue: 0%
          # white: 0%
  - id: effect_candle
    then:
      - light.turn_on:
          id: ${bulb_id}
          # TBD
  - id: effect_sleep
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 10%
          red: 100%
          green: 55%
          blue: 55%
          # white: 0%
  - id: effect_warm
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 100%
          white: 100%
          # red: 100%
          # green: 100%
          # blue: 100%
  - id: effect_natural
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 100%
          white: 100%
          # red: 100%
          # green: 100%
          # blue: 100%
  - id: effect_bright
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 100%
          white: 100%
          # red: 100%
          # green: 100%
          # blue: 100
  - id: effect_medium
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 60%
          white: 100%
          # red: 100%
          # green: 100%
          # blue: 100
  - id: effect_low
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 30%
          white: 100%
          # red: 100%
          # green: 100%
          # blue: 100
  - id: effect_night
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 30%
          white: 0%
          red: 100%
          green: 55%
          blue: 55%
  - id: effect_snow
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 100%
          white: 100%
          red: 100%
          green: 100%
          blue: 100%
  - id: effect_relax
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 50%
          white: 50%
          red: 100%
          green: 100%
          blue: 100%
  - id: effect_reading
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 80%
          white: 80%
          red: 100%
          green: 100%
          blue: 100%
  - id: effect_work
    then:
      - light.turn_on:
          id: ${bulb_id}
          brightness: 80%
          white: 80%
          red: 100%

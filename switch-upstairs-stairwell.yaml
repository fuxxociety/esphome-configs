# and keep Relay Config in sync with each other over UDP (templates/treatlife/ss01-3way.yaml).
substitutions:
  name: switch-upstairs-stairwell
  friendly_name: Upstairs Stairwell
  room_key: stairs
  peer: switch-downstairs-stairwell

packages:
  device: !include templates/treatlife/ss01-3way.yaml
